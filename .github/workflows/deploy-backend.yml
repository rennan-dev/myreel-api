name: Deploy Backend SSH (myreel-api)

on:
  push:
    branches:
      - main
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Evita dois deploys simultaneos brigando pelos mesmos arquivos
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar clone e rodar deploy no servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_URL: ${{ secrets.API_APP_URL }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: APP_URL
          script: |
            set -e

            REPO_DIR="$HOME/repos/myreel-api"
            LIVE_DIR="${MYREEL_LIVE_DIR:-$HOME/api-myreel.rennan-alves.com}"

            echo "==> Atualizando clone git em $REPO_DIR"
            cd "$REPO_DIR"
            git fetch origin main --prune
            git reset --hard origin/main
            git clean -fd --exclude=.env --exclude=scripts/

            echo "==> Rodando deploy (composer + rsync + artisan)"
            bash "$REPO_DIR/scripts/deploy-hostinger.sh"

            echo "==> Health check"
            sleep 3
            curl -fsS "${APP_URL}/up" >/dev/null && echo "OK: aplicacao respondendo em /up"
